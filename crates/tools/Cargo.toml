[package]
name = "tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Development, CI, and release tooling for the ParadoxCode repository."
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[dependencies]
dunce = "1.0"
pdc = { path = "../pdc" }
rules = { path = "../rules" }
game = { path = "../game" }
engine = { path = "../engine" }
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
semver = "1"
sha2 = "0.11"
toml = "1.1.3"
serde = "1.0"
serde_json = "1.0"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
