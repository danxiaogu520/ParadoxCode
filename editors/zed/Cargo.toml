[package]
name = "pdx-zed"
version = "0.1.3"
edition = "2024"
publish = false
description = "Zed language extension package for ParadoxCode."

# This is an editor package, not a member of the core analysis workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
crc32fast = "1"
flate2 = "1"
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
zed_extension_api = { git = "https://github.com/zed-industries/zed", tag = "v1.15.0" }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
