name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust quality gates (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-quality-gates.sh core

  msrv:
    name: Minimum supported Rust 1.97
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.97
      - run: cargo check --locked --workspace --all-targets --all-features

  windows:
    name: Rust quality gates (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --locked --release -p pdx-lsp --bin pdx --bin pdx-ls

  tree-sitter:
    name: Tree-sitter and Zed language assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            grammars/tree-sitter-eu4/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-quality-gates.sh grammars

  zed:
    name: Zed extension package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - run: bash scripts/check-quality-gates.sh zed

  vscode:
    name: VS Code extension package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix editors/vscode --no-audit --no-fund
      # The extension check compiles with tsc and smoke-tests the preview
      # contract against a cargo-built pdx-ls, so both toolchains are present.
      - run: bash scripts/check-quality-gates.sh vscode

  fuzz:
    name: Fuzz target compile and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      - name: Verify fuzz lockfile
        run: cargo metadata --locked --manifest-path fuzz/Cargo.toml --no-deps --format-version 1
      # The install-action Linux binary defaults cargo-fuzz to musl; ASan needs glibc.
      - name: Build fuzz targets
        run: cargo +nightly fuzz build --dev --target x86_64-unknown-linux-gnu
      - name: Run invariant smoke over all targets
        # Enumerate targets from fuzz/Cargo.toml via `cargo fuzz list` so new
        # fuzz targets are picked up automatically. -runs bounds each target;
        # -seed keeps the run deterministic. Seed corpus under
        # fuzz/corpus/<target>/ is replayed on startup, so regressions fixed
        # into the corpus stay covered here.
        run: |
          targets="$(cargo +nightly fuzz list)"
          if [ -z "$targets" ]; then
            echo "cargo fuzz list returned no targets" >&2
            exit 1
          fi
          for target in $targets; do
            cargo +nightly fuzz run --dev --target x86_64-unknown-linux-gnu "$target" -- -runs=200 -seed=1
          done

  release:
    name: Release and artifact smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-quality-gates.sh release

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories licenses bans sources
