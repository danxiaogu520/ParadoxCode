name: Full CI

on:
  workflow_dispatch:
  # Explicit, non-publishing verification of this workflow before merging it.
  # Only manual runs from main can authorize release preparation.
  push:
    branches: ['ci/full-validation/**']

# Run the complete quality suite explicitly before preparing a release candidate.
# Routine PR/push checks live in quick-ci.yml and cannot produce release evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

# rust-analyzer-style hardening: no incremental artifacts in CI, bounded retries
# for flaky network, and short backtraces for failing tests.
env:
  CARGO_INCREMENTAL: 0
  # Optimize test hot paths modestly; opt-level 0 repeatedly walks the full IR
  # too slowly, while opt-level 3 makes cold compilation dominate. Development
  # binaries here are validation tools, not performance measurements.
  CARGO_PROFILE_DEV_OPT_LEVEL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_OPT_LEVEL: 1
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  CI: 1
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Resolve CI evidence
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Select complete CI
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked -p tools --no-default-features -- ci plan

  workflow-lint:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install actionlint 1.7.12
        run: go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo run --locked -p tools --no-default-features -- ci workflow-lint

  rustfmt:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

  clippy:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    name: Clippy (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Rust Problem Matcher
        run: echo "::add-matcher::.github/rust.json"
      # dbg!/todo! never ship: an LSP server has no room for debug leftovers.
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::dbg_macro -D clippy::todo
      - run: cargo clippy --locked -p tools --no-default-features --all-targets -- -D warnings -D clippy::dbg_macro -D clippy::todo

  rustdoc:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  rust:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Report every failing OS instead of cancelling the healthy legs; the
      # cancel-if-matrix-failed job below cancels the whole run instead.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Rust Problem Matcher
        run: echo "::add-matcher::.github/rust.json"
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: nextest
      # Full CI covers correctness. The optimized benchmark
      # suite runs in the scheduled/manual performance workflow.
      - run: cargo check --locked --workspace --all-features
      # nextest runs unit and integration tests; doc tests need libtest (the
      # workspace currently has none — this step keeps them covered if added).
      - run: cargo nextest run --locked --workspace --all-features --no-fail-fast --hide-progress-bar
      - run: cargo test --locked --workspace --all-features --doc
      - name: Install cargo-machete
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-machete
      - name: Check for unused dependencies
        if: matrix.os == 'ubuntu-latest'
        run: cargo machete

  msrv:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    name: Minimum supported Rust 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv-1.88
      - run: cargo check --locked --workspace --all-features

      - run: cargo check --locked -p tools --no-default-features --all-targets

  vscode:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    name: VS Code extension package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: npm ci --prefix editors/vscode --no-audit --no-fund
      - name: Audit production dependencies
        run: cargo run --locked -p tools --no-default-features -- ci production-audit
      # The extension check compiles with tsc and smoke-tests the preview
      # contract against a cargo-built pdc, so both toolchains are present.
      - run: npm --prefix editors/vscode run test:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-vsix-${{ github.run_attempt }}
          path: target/paradoxcode-vscode-contract.vsix
          retention-days: 90
          if-no-files-found: error

  fuzz:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    name: Fuzz targets compile and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify fuzz lockfile
        run: cargo metadata --locked --manifest-path fuzz/Cargo.toml --no-deps --format-version 1
      # The install-action Linux binary defaults cargo-fuzz to musl; ASan needs glibc.
      - name: Build fuzz targets
        run: cargo +nightly fuzz build --dev --target x86_64-unknown-linux-gnu
      - name: Run invariant smoke over all targets
        run: cargo run --locked -p tools --no-default-features -- fuzz smoke --target x86_64-unknown-linux-gnu --runs 200 --seed 1

  release:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    name: Release and artifact smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Inline like rust-analyzer: build the shipped binary, then re-run the
      # release checks maintainers use locally through `cargo run -p tools`.
      - run: cargo build --locked -p pdc --bin paradoxcode
      - run: cargo run --locked -p tools -- check policy --root .
      - run: cargo run --locked -p tools -- check release --root .
      - name: Semantic audit regression fixtures
        run: cargo run --locked -p tools -- gates audit --root .

  dependencies:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-deny
      # Lockfile-derived policy is deterministic for the PR. Advisory databases
      # change independently of the patch and are audited by security.yml.
      - run: cargo deny check licenses bans sources

  typo-check:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    name: Typo Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_COLOR: 1
      TYPOS_VERSION: v1.50.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check for typos
        run: cargo run --locked -p tools --no-default-features -- ci typos

  cancel-if-matrix-failed:
    name: Cancel the run when a matrix leg failed
    needs: rust
    if: ${{ always() && needs.rust.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Cancel parallel jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked -p tools --no-default-features -- ci cancel-matrix-failed

  # Full-suite receipt: every quality job must succeed.
  # Cancellation, failed planning, and partial execution never become green.
  conclusion:
    name: Full conclusion
    needs:
      - plan
      - workflow-lint
      - rustfmt
      - clippy
      - rustdoc
      - rust
      - msrv
      - vscode
      - fuzz
      - release
      - dependencies
      - typo-check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.plan.outputs.full == 'true' && needs.vscode.result == 'success'
        with:
          name: ci-vsix-${{ github.run_attempt }}
          path: target/ci/vsix
      - name: Verify complete results and record their source-bound receipt
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJson(needs) }}
          REUSE_RUN: ${{ needs.plan.outputs.reuse_run }}
        run: >-
          cargo run --locked -p tools --no-default-features -- ci receipt
          --reuse-run "$REUSE_RUN" --vsix target/ci/vsix/paradoxcode-vscode-contract.vsix
          --output target/ci/ci.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-evidence-${{ github.run_attempt }}
          path: target/ci/ci.json
          retention-days: 90
          if-no-files-found: error
