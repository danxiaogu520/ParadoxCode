<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}}; img-src data:; connect-src 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{styleUri}}">
    <title>Mission Tree Preview</title>
</head>
<body>
    <header class="toolbar" aria-label="Mission preview controls">
        <button id="fit" type="button" title="Fit mission tree (F)">Fit</button>
        <button id="zoom-out" type="button" title="Zoom out (-)">−</button>
        <button id="zoom-in" type="button" title="Zoom in (+)">+</button>
        <div class="search">
            <input id="search" type="text" placeholder="Search missions…"
                   aria-label="Search missions by title or id" autocomplete="off" spellcheck="false">
            <div id="search-results" role="list" aria-label="Matching missions"></div>
        </div>
        <details id="series-list" class="series-list">
            <summary id="series-summary">Series</summary>
            <div class="series-content">
                <div id="series-entries" role="list" aria-label="Mission series visibility"></div>
                <div class="series-actions">
                    <button id="series-all" type="button">All</button>
                    <button id="series-none" type="button">None</button>
                </div>
            </div>
        </details>
    </header>
    <canvas id="tree" tabindex="0" role="img" aria-label="Mission tree preview"></canvas>
    <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <script src="{{scriptUri}}"></script>
</body>
</html>
