name: Feature request
description: Propose a focused improvement to ParadoxCode
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete modding workflow or limitation, not only the desired API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what users should observe when the feature is complete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds and relevant tradeoffs.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - EU4 language behavior
        - Game-neutral engine behavior
        - Zed integration
        - CLI or release tooling
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue or RFC covering this request.
          required: true
        - label: This request does not require redistributing game files or private Mod content.
          required: true
