name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Unpublished annotated version tag to publish (for example, v0.4.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  preflight:
    name: Verify release provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.verify.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify tag, main ancestry, CI, and release state
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a stable semantic version such as v0.4.0: $RELEASE_TAG" >&2
            exit 1
          fi

          git fetch --force origin main "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]; then
            echo "Release tag must be annotated: $RELEASE_TAG" >&2
            exit 1
          fi

          release_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo "Release tag does not point to a commit on main: $release_sha" >&2
            exit 1
          }

          conclusion="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$release_sha/check-runs" \
              --jq '[.check_runs | sort_by(.completed_at) | reverse[] | select(.name == "Conclusion") | .conclusion][0] // "missing"'
          )"
          if [ "$conclusion" != "success" ]; then
            echo "The tagged commit must have a successful Conclusion check; got: $conclusion" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $RELEASE_TAG; published releases are never overwritten." >&2
            exit 1
          fi

          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: paradoxcode
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: paradoxcode
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: paradoxcode
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: paradoxcode
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: paradoxcode.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Build server
        shell: bash
        run: cargo build --locked --release -p pdc --bin paradoxcode --target "${{ matrix.target }}"
      - name: Verify release version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          cargo run --locked -p tools -- check policy --root .
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          test "$("$binary" --version)" = "paradoxcode $version"
      - name: Package server and checksum
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          cargo run --locked -p tools -- release package \
            --version "$version" \
            --target "${{ matrix.target }}" \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --output-dir dist \
            --root .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  vscode:
    name: Build VS Code extension
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --prefix editors/vscode --no-audit --no-fund
      - name: Audit production dependencies
        run: npm --prefix editors/vscode audit --omit=dev --audit-level=high
      - name: Verify extension and tag versions
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          node -e '
            const packageJson = require("./editors/vscode/package.json");
            const packageLock = require("./editors/vscode/package-lock.json");
            const expected = process.argv[1];
            if (packageJson.version !== expected || packageLock.version !== expected) {
              throw new Error(
                "VS Code versions must equal tag " + expected +
                ": package=" + packageJson.version +
                ", lock=" + packageLock.version
              );
            }
          ' "$version"
      - name: Check and package extension
        working-directory: editors/vscode
        shell: bash
        run: |
          npm run test:contract
          mkdir -p ../../dist
          version="${RELEASE_TAG#v}"
          npm exec -- vsce package --out "../../dist/paradoxcode-vscode-${version}.vsix"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-extension
          path: dist/*.vsix
          if-no-files-found: error

  sweep:
    name: Validate release against Vanilla
    needs: [preflight, build, vscode]
    uses: ./.github/workflows/sweep.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      windows_artifact_name: server-x86_64-pc-windows-msvc

  publish:
    name: Publish immutable GitHub Release
    needs: [preflight, build, vscode, sweep]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: server-*
          path: dist/server
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vscode-extension
          path: dist/extension
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-sweep-summary
          path: dist/sweep
      - name: Verify complete release payload
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo run --locked -p tools -- release verify \
            --version "$version" \
            --directory dist/server \
            --root .
          test -s "dist/extension/paradoxcode-vscode-${version}.vsix"
          test -s dist/sweep/sweep-summary.json
          jq --exit-status \
            --arg label "$RELEASE_TAG" \
            '.label == $label and .gate.passed == true' \
            dist/sweep/sweep-summary.json

          mkdir -p dist/release
          cp dist/server/* dist/release/
          cp dist/extension/*.vsix dist/release/
          cp dist/sweep/sweep-summary.json dist/release/
          test "$(find dist/release -maxdepth 1 -type f | wc -l)" -eq 12
      - name: Create, verify, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG; refusing to overwrite it." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" dist/release/* \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"

          mapfile -t expected < <(find dist/release -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t actual < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
          if ! diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}"); then
            echo "Draft release assets do not match the verified local payload." >&2
            exit 1
          fi

          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "Release $RELEASE_TAG is public and immutable; Marketplace publication remains a separate audited step."
