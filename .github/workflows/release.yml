name: Release

# Tags are created only after a complete candidate succeeds. Tag pushes never rebuild.
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: "Successful Release candidate workflow run ID"
        required: true
        type: string

concurrency:
  group: release-promotion
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  publish:
    name: Promote verified candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify candidate, audit and staging uploads before final publication
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: cargo run --locked -p tools --no-default-features -- ci promote --candidate-run "$CANDIDATE_RUN"
