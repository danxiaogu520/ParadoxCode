[package]
name = "tools"
default-run = "tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Development, CI, and release tooling for the ParadoxCode repository."
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[features]
default = ["analysis"]
analysis = ["dep:text", "dep:parser", "dep:pdc", "dep:rules", "dep:game", "dep:engine", "dep:ide", "dep:rusqlite"]

[dependencies]
text = { path = "../text", optional = true }
parser = { path = "../parser", optional = true }
dunce = "1.0"
pdc = { path = "../pdc", optional = true }
rules = { path = "../rules", optional = true }
game = { path = "../game", optional = true }
engine = { path = "../engine", optional = true }
ide = { path = "../ide", optional = true }
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
semver = "1"
sha2 = "0.11"
toml = "1.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
tempfile = "3"
regex = "1"

[lints]
workspace = true
