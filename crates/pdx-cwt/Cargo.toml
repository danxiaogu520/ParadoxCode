[package]
name = "pdx-cwt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "One-time CWT importer boundary for ParadoxCode."
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[dependencies]
pdx-game-eu4 = { path = "../pdx-game-eu4" }
pdx-rules = { path = "../pdx-rules" }
pdx-text = { path = "../pdx-text" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pdx-cwt"
path = "src/main.rs"

[lints]
workspace = true
