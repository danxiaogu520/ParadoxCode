[package]
name = "pdc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Language-server lifecycle, CLI entry points, and protocol boundary for ParadoxCode."
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[dependencies]
game = { path = "../game" }
parser = { path = "../parser" }
rules = { path = "../rules" }
ide = { path = "../ide" }
text = { path = "../text" }
engine = { path = "../engine" }
lsp-types = "0.97.0"
serde = "1.0"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

# The crate keeps its short `pdc` name internally, but the shipped executable carries the
# user-facing product name.
[[bin]]
name = "paradoxcode"
path = "src/bin/paradoxcode.rs"

[lints]
workspace = true
