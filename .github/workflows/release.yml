name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Verify release credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Require VS Code Marketplace credentials
        shell: bash
        run: ': "${VSCE_PAT:?VSCE_PAT Actions secret is required before tagging a release}"'

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: pdx-ls
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: pdx-ls
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: pdx-ls
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: pdx-ls
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: pdx-ls.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build server
        shell: bash
        run: cargo build --locked --release -p pdx-lsp --bin pdx-ls --target "${{ matrix.target }}"
      - name: Verify release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo run --locked --bin pdx -- check policy --root .
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          test "$("$binary" --version)" = "pdx-ls $version"
      - name: Package server and checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo run --locked --bin pdx -- release package \
            --version "$version" \
            --target "${{ matrix.target }}" \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --output-dir dist \
            --root .
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish immutable GitHub Release
    needs: build
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - name: Verify complete matrix and checksums
        shell: bash
        run: |
          cargo run --locked --bin pdx -- release verify \
            --version "${GITHUB_REF_NAME#v}" \
            --directory dist \
            --root .
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  vscode:
    name: Publish VS Code Marketplace extension
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --prefix editors/vscode --no-audit --no-fund
      - name: Verify extension and tag versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e '
            const packageJson = require("./editors/vscode/package.json");
            const packageLock = require("./editors/vscode/package-lock.json");
            const expected = process.argv[1];
            if (packageJson.version !== expected || packageLock.version !== expected) {
              throw new Error(`VS Code versions must equal tag ${expected}: package=${packageJson.version}, lock=${packageLock.version}`);
            }
          ' "$version"
      - name: Check and package extension
        working-directory: editors/vscode
        shell: bash
        run: |
          npm run test:contract
          mkdir -p ../../dist
          npm exec -- vsce package --out "../../dist/paradoxcode-vscode-${GITHUB_REF_NAME#v}.vsix"
      - name: Attach VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "dist/paradoxcode-vscode-${GITHUB_REF_NAME#v}.vsix"
      - name: Publish the same VSIX to Visual Studio Marketplace
        working-directory: editors/vscode
        shell: bash
        run: |
          : "${VSCE_PAT:?VSCE_PAT Actions secret is required to publish the VS Code extension}"
          npm exec -- vsce publish \
            --packagePath "../../dist/paradoxcode-vscode-${GITHUB_REF_NAME#v}.vsix"
