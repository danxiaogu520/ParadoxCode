[package]
name = "pdx-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Language-server lifecycle, CLI entry points, and protocol boundary for ParadoxCode."
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[dependencies]
pdx-game = { path = "../pdx-game" }
pdx-parser = { path = "../pdx-parser" }
pdx-rules = { path = "../pdx-rules" }
pdx-analysis = { path = "../pdx-analysis" }
pdx-text = { path = "../pdx-text" }
pdx-engine = { path = "../pdx-engine" }
flate2 = "1"
lsp-types = "0.97.0"
serde = "1.0"
serde_json = "1.0"
semver = "1"
sha2 = "0.11"
tar = "0.4"
toml = "1.1.3"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "pdx"
path = "src/bin/pdx.rs"

[[bin]]
name = "pdx-ls"
path = "src/bin/pdx-ls.rs"

[lints]
workspace = true
