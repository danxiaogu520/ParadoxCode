[package]
name = "pdx-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "VFS, source-root, and immutable snapshot boundary for ParadoxCode."

[dependencies]
pdx-hir = { path = "../pdx-hir" }
pdx-rules = { path = "../pdx-rules" }
pdx-syntax = { path = "../pdx-syntax" }
pdx-text = { path = "../pdx-text" }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[lints]
workspace = true

[dev-dependencies]
pdx-game-eu4 = { path = "../pdx-game-eu4" }

[[bench]]
name = "synthetic_workspace"
harness = false
