[workspace]
resolver = "2"
members = [
    "crates/pdx-text",
    "crates/pdx-parser",
    "crates/pdx-rules",
    "crates/pdx-game",
    "crates/pdx-engine",
    "crates/pdx-analysis",
    "crates/pdx-lsp",
]

# `pdx setup vanilla` is commonly exercised through `target/debug/pdx.exe` during development.
# Keep debug symbols and assertions, but optimize the cache-building hot path so the debug
# executable has representative performance instead of a 3x-4x unoptimized scan penalty.
[profile.dev]
opt-level = 3

# Tests do not need the optimized development profile. Keeping test builds
# unoptimized avoids spending several minutes optimizing test binaries on CI;
# benchmark runs use the separate bench profile below.
[profile.test]
opt-level = 0

[profile.bench]
opt-level = 3

# Line tables only: full optimization with enough symbol information for
# release-build sampling profilers (samply/VTune) to attribute frames,
# without the size and build-time cost of full debug info.
[profile.release]
debug = "line-tables-only"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
authors = ["ParadoxCode contributors"]
homepage = "https://github.com/danxiaogu520/ParadoxCode"
repository = "https://github.com/danxiaogu520/ParadoxCode"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
