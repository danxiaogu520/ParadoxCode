name: PR autosync

# Keeps the maintainer's pull requests self-driving. Every maintainer PR gets
# squash auto-merge enabled as soon as it exists, and every push to main
# refreshes all open maintainer PR branches (update-branch) so their CI re-runs
# against the latest base. GitHub's native auto-merge then merges each PR once
# the required `Conclusion` check is green and the branch has no conflicts —
# no manual auto-merge enablement and no manual branch syncing left to do.
#
# Everything runs through the AUTOMERGE_TOKEN fine-grained PAT, never
# GITHUB_TOKEN: pushes made with GITHUB_TOKEN intentionally trigger no other
# workflows, which would leave refreshed branches without a CI run (auto-merge
# then waits forever for a check that never comes) and main without its
# post-merge Conclusion run.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  # One autosync pass at a time; a newer pass supersedes an older one and
  # re-lists whatever PRs are still open.
  group: pr-autosync
  cancel-in-progress: true

jobs:
  autosync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job receives a write token. Its executable code comes from the trusted default branch.
          ref: ${{ github.event.repository.default_branch }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Enable auto-merge and refresh branches
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -f crates/tools/src/ci.rs ]]; then
            cargo run --locked -p tools --no-default-features -- ci autosync
          else
            # Bootstrap the migration with the legacy script already trusted on main.
            # Do not execute PR-head code with AUTOMERGE_TOKEN.
            bootstrap_script="${RUNNER_TEMP}/pr-autosync-bootstrap.sh"
            git show HEAD:.github/workflows/pr-autosync.yml |
              sed -n '/^        run: |$/,$p' |
              sed '1d;s/^          //' > "$bootstrap_script"
            test -s "$bootstrap_script"
            bash "$bootstrap_script"
          fi
