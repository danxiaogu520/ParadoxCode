[package]
name = "pdx-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Game-independent rules schema, runtime, and first-party compiler for ParadoxCode."
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[dependencies]
rustc-hash = "2"
pdx-parser = { path = "../pdx-parser" }
pdx-text = { path = "../pdx-text" }
rusqlite = { version = "0.40", features = ["bundled"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[[bin]]
name = "pdx-bake"
path = "src/bin/pdx-bake.rs"

[[bin]]
name = "pdx-flag-audit"
path = "src/bin/pdx-flag-audit.rs"

[lints]
workspace = true

