[package]
name = "pdx-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "VFS, source-root, and immutable snapshot boundary for ParadoxCode."
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[dependencies]
bincode = "1.3"
encoding_rs = "0.8"
pdx-rules = { path = "../pdx-rules" }
pdx-parser = { path = "../pdx-parser" }
pdx-text = { path = "../pdx-text" }
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zstd = "0.13"

[lints]
workspace = true

[dev-dependencies]
pdx-game = { path = "../pdx-game" }

[[bench]]
name = "synthetic_workspace"
harness = false

[[bench]]
name = "index_cache"
harness = false
