name: Release sweep

# The per-release performance and diagnostics gate: cold-start the server,
# rebuild the Vanilla index cache, diagnose the full Vanilla workspace, and
# record phase timings plus a diagnostics fingerprint. Runs only on the
# repository's self-hosted runner — it needs the local EU4 installation for
# the Vanilla tree and stable hardware for release-to-release comparisons —
# and is deliberately never triggered by pull_request.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  # contents: write is required to attach the sweep summary to the release
  # so the next release's sweep can compare against it.
  contents: write

concurrency:
  group: sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    defaults:
      run:
        # bash, cargo, node, and gh all resolve through the machine PATH — the
        # environment a Windows service account inherits. Git\bin (bash.exe),
        # ~/.cargo/bin, and the nodejs dir are pinned there; the runner's
        # .path file mechanism is Linux/macOS-only (runsvc.sh) and does not
        # apply to RunnerService.exe.
        shell: bash
    env:
      # The rustup shim needs the user's toolchain home; the service account
      # has no user profile of its own.
      RUSTUP_HOME: C:/Users/Administrator/.rustup
      CARGO_HOME: C:/Users/Administrator/.cargo
      PDC_SWEEP_VANILLA_SOURCE: C:/Program Files (x86)/Steam/steamapps/common/Europa Universalis IV
    steps:
      - uses: actions/checkout@v7

      - name: Build release server
        run: cargo build --locked --release -p pdc

      - name: Cold caches
        run: |
          # The sweep owns a dedicated cache path, separate from any IDE user
          # cache (the service account cannot and should not touch those), so
          # a cold run is a plain file deletion away.
          mkdir -p /c/actions-runner/sweep-cache
          rm -f /c/actions-runner/sweep-cache/vanilla.pdcindex
          echo "Vanilla cache removed for a cold sweep"

      - name: Fetch previous release sweep summary
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          # Walk releases newest-first and stop at the first one carrying a
          # sweep summary; none yet (first gated release) simply skips --previous.
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 10 --json tagName --jq '.[].tagName'); do
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "sweep-summary.json" --dir previous --clobber 2>/dev/null; then
              echo "previous sweep summary from release $tag"
              break
            fi
          done
          [ -f previous/sweep-summary.json ] || echo "no previous sweep summary found"

      - name: Run release sweep
        # Gate semantics: absolute severities cannot gate (the Vanilla
        # workspace carries a known error baseline under the current rules).
        # With a previous sweep summary the gate is the diagnostics
        # fingerprint; without one it follows the fail-on status.
        run: |
          prev_args=()
          if [ -f previous/sweep-summary.json ]; then
            prev_args+=(--previous previous/sweep-summary.json)
          fi
          node editors/vscode/scripts/sweep.mjs \
            --label "${{ github.event.release.tag_name || github.sha }}" \
            --server target/release/paradoxcode.exe \
            --vanilla-cache "C:/actions-runner/sweep-cache/vanilla.pdcindex" \
            --fail-on none \
            "${prev_args[@]}"

      - name: Attach sweep summary to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            performance-results/sweep-summary.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: release-sweep
          path: performance-results/
          retention-days: 90
