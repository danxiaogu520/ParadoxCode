[package]
name = "pdc-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
engine = { path = "../crates/engine" }
game = { path = "../crates/game" }
transcode = { path = "../crates/transcode" }
hir = { path = "../crates/hir" }
rules = { path = "../crates/rules" }
parser = { path = "../crates/parser" }
text = { path = "../crates/text" }

[[bin]]
name = "parse-script"
path = "fuzz_targets/parse_script.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse-localisation"
path = "fuzz_targets/parse_localisation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "incremental-edits"
path = "fuzz_targets/incremental_edits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format-script"
path = "fuzz_targets/format_script.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lower-hir"
path = "fuzz_targets/lower_hir.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quoted-script"
path = "fuzz_targets/quoted_script.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transcode-decode"
path = "fuzz_targets/transcode_decode.rs"
