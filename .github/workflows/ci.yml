name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps
      - run: bash scripts/check-phase0.sh

  tree-sitter:
    name: Tree-sitter and Zed language assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            grammars/tree-sitter-pdx-script/package-lock.json
            grammars/tree-sitter-pdx-eu4-localisation/package-lock.json
            grammars/tree-sitter-pdx-eu4-csv/package-lock.json
      - run: bash scripts/check-phase1-grammars.sh
      - run: python3 scripts/prepare-zed-dev-manifest.py
      - run: python3 scripts/check-zed-extension.py

  zed:
    name: Zed extension package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path editors/zed/Cargo.toml -- --check
      - run: cargo check --manifest-path editors/zed/Cargo.toml --all-targets

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories licenses bans sources
