[package]
name = "rules"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Game-independent rules schema, runtime, and first-party compiler for ParadoxCode."
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[dependencies]
rustc-hash = "2"
text = { path = "../text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "rulec"
path = "src/bin/rulec.rs"

[lints]
workspace = true
