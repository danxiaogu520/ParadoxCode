<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}}; img-src data:; connect-src 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{styleUri}}">
    <title data-i18n="panelTitle">Mission Icons</title>
</head>
<body>
    <header class="picker-toolbar" data-i18n-aria-label="toolbarAria" aria-label="Mission icon picker controls">
        <input id="search" type="text" data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="searchAria"
               placeholder="Search icons…" autocomplete="off" spellcheck="false">
        <div class="tabs" role="tablist" data-i18n-aria-label="tabsAria" aria-label="Sprite scope">
            <button id="tab-mission" class="tab" role="tab" aria-selected="true" type="button" data-i18n="tabMission">Mission icons</button>
            <button id="tab-all" class="tab" role="tab" aria-selected="false" type="button" data-i18n="tabAll">All sprites</button>
        </div>
        <span id="count" class="count" role="status" aria-live="polite"></span>
    </header>
    <div id="grid" class="grid" role="list" data-i18n-aria-label="gridAria" aria-label="Sprite tiles"></div>
    <div id="message" class="message" role="status" aria-live="polite" hidden></div>
    <p id="hint" class="hint" data-i18n="hint">Click a tile to write it into the focused editor and close this panel.</p>
    <script src="{{scriptUri}}"></script>
</body>
</html>
