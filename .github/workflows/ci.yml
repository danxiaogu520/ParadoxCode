name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref; superseded runs are cancelled. Following rust-analyzer, every
# job runs on every PR and push: no path filtering, no skip bookkeeping. The
# fast lint jobs (rustfmt, clippy, rustdoc) return within minutes and never wait
# behind the test suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

  clippy:
    name: Clippy (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # PR/push CI keeps the fast correctness path. The optimized benchmark
      # suite runs in the scheduled/manual performance workflow.
      - run: cargo check --locked --workspace --all-features
      - run: cargo test --locked --workspace --all-features

  msrv:
    name: Minimum supported Rust 1.98
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.98
      - run: cargo check --locked --workspace --all-features

  windows:
    name: Rust quality gates (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-features
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo clippy --locked --workspace --all-features -- -D warnings

  windows-release:
    name: Windows release build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Keep the optimized build on a separate runner so it overlaps with the
      # Windows test and lint job instead of extending its critical path.
      - run: cargo build --locked --release -p pdc --bin pdc

  vscode:
    name: VS Code extension package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix editors/vscode --no-audit --no-fund
        # The extension check compiles with tsc and smoke-tests the preview
        # contract against a cargo-built pdc, so both toolchains are present.
      - run: npm --prefix editors/vscode run test:ci

  fuzz:
    name: Fuzz targets compile and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      - name: Verify fuzz lockfile
        run: cargo metadata --locked --manifest-path fuzz/Cargo.toml --no-deps --format-version 1
      # The install-action Linux binary defaults cargo-fuzz to musl; ASan needs glibc.
      - name: Build fuzz targets
        run: cargo +nightly fuzz build --dev --target x86_64-unknown-linux-gnu
      - name: Run invariant smoke over all targets
        # Enumerate targets from fuzz/Cargo.toml via `cargo fuzz list` so new
        # fuzz targets are picked up automatically. -runs bounds each target;
        # -seed keeps the run deterministic. Seed corpus under
        # fuzz/corpus/<target>/ is replayed on startup, so regressions fixed
        # into the corpus stay covered here.
        run: |
          targets="$(cargo +nightly fuzz list)"
          if [ -z "$targets" ]; then
            echo "cargo fuzz list returned no targets" >&2
            exit 1
          fi
          for target in $targets; do
            cargo +nightly fuzz run --dev --target x86_64-unknown-linux-gnu "$target" -- -runs=200 -seed=1
          done

  release:
    name: Release and artifact smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-release.sh

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories licenses bans sources
