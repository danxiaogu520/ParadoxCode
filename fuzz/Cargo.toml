[package]
name = "pdx-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
pdx-format = { path = "../crates/pdx-format" }
pdx-syntax = { path = "../crates/pdx-syntax" }
pdx-text = { path = "../crates/pdx-text" }

[[bin]]
name = "parse-pdx-script"
path = "fuzz_targets/parse_pdx_script.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse-localisation"
path = "fuzz_targets/parse_localisation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "incremental-edits"
path = "fuzz_targets/incremental_edits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format-pdx-script"
path = "fuzz_targets/format_pdx_script.rs"
test = false
doc = false
bench = false
