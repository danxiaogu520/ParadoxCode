name: Performance

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  # Explicit benchmark validation without adding heavy work to ordinary PRs.
  push:
    branches: ['ci/perf-validation/**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    name: Rust benchmarks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: perf-stable
      - name: Run optimized benchmark suite
        run: cargo run --locked -p tools -- perf bench --repeat 3
      - name: Preserve benchmark reports and raw logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/perf/runs/
          if-no-files-found: warn
          retention-days: 14
