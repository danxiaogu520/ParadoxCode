name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish (for example, v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  preflight:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a stable semantic version such as v0.1.0: $RELEASE_TAG" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: pdx-ls
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: pdx-ls
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: pdx-ls
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: pdx-ls
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: pdx-ls.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build server
        shell: bash
        run: cargo build --locked --release -p pdx-lsp --bin pdx-ls --target "${{ matrix.target }}"
      - name: Verify release version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          cargo run --locked --bin pdx -- check policy --root .
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          test "$("$binary" --version)" = "pdx-ls $version"
      - name: Package server and checksum
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          cargo run --locked --bin pdx -- release package \
            --version "$version" \
            --target "${{ matrix.target }}" \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --output-dir dist \
            --root .
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish immutable GitHub Release
    needs: build
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - name: Verify complete matrix and checksums
        shell: bash
        run: |
          cargo run --locked --bin pdx -- release verify \
            --version "${RELEASE_TAG#v}" \
            --directory dist \
            --root .
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes

  vscode:
    name: Publish VS Code Marketplace extension
    needs: publish
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Build OIDC-enabled vsce
        shell: bash
        run: |
          vsce_root="${RUNNER_TEMP}/vscode-vsce"
          git clone --depth 1 https://github.com/microsoft/vscode-vsce.git "$vsce_root"
          git -C "$vsce_root" fetch --depth 1 origin c998e2a8604ba07d2b6a364d1742c1bc38e7d8ff
          git -C "$vsce_root" checkout --detach c998e2a8604ba07d2b6a364d1742c1bc38e7d8ff
          npm ci --prefix "$vsce_root" --no-audit --no-fund
          npm run build --prefix "$vsce_root"
          echo "VSCE_ROOT=$vsce_root" >> "$GITHUB_ENV"
      - run: npm ci --prefix editors/vscode --no-audit --no-fund
      - name: Verify extension and tag versions
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          node -e '
            const packageJson = require("./editors/vscode/package.json");
            const packageLock = require("./editors/vscode/package-lock.json");
            const expected = process.argv[1];
            if (packageJson.version !== expected || packageLock.version !== expected) {
              throw new Error(`VS Code versions must equal tag ${expected}: package=${packageJson.version}, lock=${packageLock.version}`);
            }
          ' "$version"
      - name: Check and package extension
        working-directory: editors/vscode
        shell: bash
        run: |
          npm run test:contract
          mkdir -p ../../dist
          version="${RELEASE_TAG#v}"
          npm exec -- vsce package --out "../../dist/paradoxcode-vscode-${version}.vsix"
      - name: Attach VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" "dist/paradoxcode-vscode-${version}.vsix"
      - name: Publish the same VSIX with Marketplace trusted publishing
        working-directory: editors/vscode
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          node "$VSCE_ROOT/vsce" publish --oidc \
            --packagePath "../../dist/paradoxcode-vscode-${version}.vsix"
